[project]
name = "paintings"
version = "0.1.0"
description = "Classificação de estilos de pintura por representações visuais estruturadas (CNA 2026)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "scikit-image",
    "networkx",
    "matplotlib",
    "xgboost",
    "h5py",
    "pillow",
    "requests",
    "imagehash",
    "transformers>=5.12.1",
    "vllm>=0.23.0",
    "pycatch22>=0.5.0",
    "pyarrow>=25.0.0",
    "pywavelets>=1.9.0",
]

[project.optional-dependencies]
baselines = [
    "torch",
    "torchvision",
    "lightgbm",
    "open-clip-torch",
    "duckdb",
]
affect = [
    "torch",
    "torchvision",
    "timm",
    "peft",
    "transformers>=4.49.0",
]
slm = [
    "vllm>=0.19.1",
    "transformers>=4.49.0",
    "torch",
    "pillow",
    "requests",
    "qwen-vl-utils",
    "kagglehub",
]
[tool.uv]
package = false
